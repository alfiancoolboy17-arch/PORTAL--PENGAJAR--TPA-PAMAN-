<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Login TPA</title>
<style>
    body { font-family: sans-serif; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #222; padding: 30px; border-radius: 10px; width: 300px; text-align: center; }
    input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: none; }
    button { width: 100%; padding: 10px; background: #00ff88; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    .error { color: red; font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>LOGIN TPA</h2>
    <form id="formLogin">
        <input type="text" id="user" value="admin" placeholder="Username">
        <input type="password" id="pass" value="admin123" placeholder="Password">
        <button type="submit" id="btn">MASUK</button>
    </form>
    <div class="error" id="pesanError"></div>
</div>

<div class="box" id="dashboardBox" style="display:none;">
    <h2>✅ LOGIN BERHASIL!</h2>
    <p>Selamat datang, <span id="namaUser"></span></p>
    <p style="font-size:12px; color:#aaa;">Jika halaman ini muncul, berarti masalahnya cuma di kode tampilan yang lama (CSS/Chart/Animasi).</p>
</div>

<script>
document.getElementById('formLogin').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('pesanError');
    
    btn.innerText = "Memproses...";
    btn.disabled = true;
    err.innerText = "";

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('user').value,
                password: document.getElementById('pass').value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || 'Login Gagal');
        }

        // JIKA BERHASIL
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboardBox').style.display = 'block';
        document.getElementById('namaUser').innerText = data.user.name;

    } catch (error) {
        err.innerText = error.message;
        btn.innerText = "MASUK";
        btn.disabled = false;
    }
});
</script>

</body>
</html>
