<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Presensi TPA PAMAN - Gamer Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --bg:#0a0a0c;
  --card-bg:#121216;
  --neon-cyan:#00f3ff;
  --neon-green:#00ff88;
  --neon-red:#ff0055;
  --neon-orange:#ffaa00;
  --text:#e0e0e0;
}
body{background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(circle at 50% 0%, #1a1a24 0%, #0a0a0c 70%);}
.hidden{display:none!important}

/* LOGIN NEON */
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{
  background:var(--card-bg);border-radius:20px;padding:40px 32px;width:100%;max-width:400px;text-align:center;
  border: 1px solid rgba(0, 243, 255, 0.3);
  box-shadow: 0 0 20px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.05);
  position: relative; overflow: hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;width:100%;height:3px;
  background:linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  animation: scan 2s linear infinite;
}
@keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

.logo-wrap{display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;background:#1a1a24;border-radius:50%;margin-bottom:15px;border:2px solid var(--neon-green);box-shadow:0 0 15px var(--neon-green)}
.login-card h1{font-size:18px;color:#fff;margin-top:12px;line-height:1.3;text-shadow:0 0 10px rgba(255,255,255,0.5)}
.login-card h2{font-size:14px;color:var(--neon-cyan);font-weight:700;margin:6px 0;letter-spacing:2px}
.login-card .welcome{color:#888;font-size:13px;margin-bottom:24px}
.input-group{text-align:left;margin-bottom:16px}
.input-group label{display:block;font-size:12px;font-weight:600;color:var(--neon-cyan);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.input-group input{width:100%;padding:12px 14px;background:#0a0a0c;border:1px solid #333;border-radius:8px;font-size:15px;color:#fff;outline:none;transition:.3s}
.input-group input:focus{border-color:var(--neon-green);box-shadow:0 0 10px rgba(0, 255, 136, 0.3)}
.btn{padding:12px 20px;border:none;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;transition:.3s;text-transform:uppercase;letter-spacing:1px}
.btn-primary{background:transparent;color:var(--neon-green);border:2px solid var(--neon-green);width:100%;box-shadow:0 0 10px rgba(0,255,136,0.2)}
.btn-primary:hover{background:var(--neon-green);color:#000;box-shadow:0 0 20px var(--neon-green)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.error-msg{color:var(--neon-red);font-size:13px;margin-top:10px;min-height:18px;text-shadow:0 0 5px var(--neon-red)}

/* APP NEON */
#appView{min-height:100vh;display:flex;flex-direction:column}
header.app-header{
  background:rgba(18, 18, 22, 0.9);backdrop-filter:blur(10px);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(0, 243, 255, 0.2);box-shadow:0 4px 15px rgba(0,0,0,0.5);position:sticky;top:0;z-index:10
}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;border-radius:50%;border:1px solid var(--neon-cyan);box-shadow:0 0 10px var(--neon-cyan);padding:2px;background:#000}
.header-title{font-size:14px;font-weight:700;color:#fff;text-shadow:0 0 5px rgba(255,255,255,0.3)}
.header-sub{font-size:11px;color:var(--neon-green)}
.header-right{display:flex;align-items:center;gap:8px}
.user-badge{background:rgba(0, 243, 255, 0.1);border:1px solid var(--neon-cyan);color:var(--neon-cyan);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.btn-logout{background:transparent;border:1px solid var(--neon-red);color:var(--neon-red);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-weight:600;transition:.3s}
.btn-logout:hover{background:var(--neon-red);color:#fff;box-shadow:0 0 10px var(--neon-red)}

nav.tabs{display:flex;background:#121216;border-bottom:1px solid #222;overflow-x:auto;position:sticky;top:68px;z-index:9}
nav.tabs button{flex:1;min-width:90px;padding:14px 10px;background:none;border:none;font-size:13px;font-weight:700;color:#666;cursor:pointer;border-bottom:3px solid transparent;transition:.3s;white-space:nowrap}
nav.tabs button.active{color:var(--neon-green);border-bottom-color:var(--neon-green);text-shadow:0 0 10px rgba(0,255,136,0.5)}

main.content{flex:1;padding:18px;max-width:900px;margin:0 auto;width:100%}
.card{background:var(--card-bg);border-radius:16px;padding:18px;margin-bottom:16px;border:1px solid #222;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
.card h2{font-size:16px;color:var(--neon-cyan);margin-bottom:14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #222;padding-bottom:10px}
.date-info{font-size:13px;color:#888;margin-bottom:12px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.stat-box{background:var(--card-bg);border-radius:14px;padding:16px;text-align:center;border:1px solid #333;transition:.3s}
.stat-box:hover{transform:translateY(-2px)}
.stat-box .num{font-size:26px;font-weight:800;color:var(--neon-cyan);text-shadow:0 0 10px rgba(0,243,255,0.4)}
.stat-box .label{font-size:12px;color:#888;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.stat-box.tepat{border-color:var(--neon-green);box-shadow:0 0 10px rgba(0,255,136,0.1)}
.stat-box.tepat .num{color:var(--neon-green);text-shadow:0 0 10px rgba(0,255,136,0.4)}
.stat-box.telat{border-color:var(--neon-orange);box-shadow:0 0 10px rgba(255,170,0,0.1)}
.stat-box.telat .num{color:var(--neon-orange);text-shadow:0 0 10px rgba(255,170,0,0.4)}
.stat-box.tidak{border-color:var(--neon-red);box-shadow:0 0 10px rgba(255,0,85,0.1)}
.stat-box.tidak .num{color:var(--neon-red);text-shadow:0 0 10px rgba(255,0,85,0.4)}

.teacher-row{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #222;border-radius:10px;margin-bottom:8px;flex-wrap:wrap;gap:8px;background:#0a0a0c;transition:.3s}
.teacher-row:hover{border-color:#444}
.teacher-info{display:flex;flex-direction:column}
.teacher-name{font-weight:600;font-size:14px;color:#fff}
.teacher-class{font-size:11px;color:var(--neon-cyan)}
.att-buttons{display:flex;gap:6px;flex-wrap:wrap}
.att-btn{padding:6px 10px;border-radius:8px;border:1px solid;background:transparent;font-size:12px;font-weight:600;cursor:pointer;transition:.3s}
.att-btn.tepat{border-color:var(--neon-green);color:var(--neon-green)}
.att-btn.tepat.active,.att-btn.tepat:hover{background:var(--neon-green);color:#000;box-shadow:0 0 10px var(--neon-green)}
.att-btn.telat{border-color:var(--neon-orange);color:var(--neon-orange)}
.att-btn.telat.active,.att-btn.telat:hover{background:var(--neon-orange);color:#000;box-shadow:0 0 10px var(--neon-orange)}
.att-btn.tidak{border-color:var(--neon-red);color:var(--neon-red)}
.att-btn.tidak.active,.att-btn.tidak:hover{background:var(--neon-red);color:#fff;box-shadow:0 0 10px var(--neon-red)}

.class-section{margin-bottom:16px}
.class-header{font-size:14px;font-weight:700;color:#fff;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #333}

table{width:100%;border-collapse:collapse;font-size:13px}
table th{background:#0a0a0c;color:var(--neon-cyan);padding:10px 8px;text-align:left;font-weight:600;border-bottom:1px solid #333}
table td{padding:10px 8px;border-bottom:1px solid #222;color:#ccc}
table tr:last-child td{border-bottom:none}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.tepat{background:rgba(0,255,136,0.1);color:var(--neon-green);border:1px solid var(--neon-green)}
.badge.telat{background:rgba(255,170,0,0.1);color:var(--neon-orange);border:1px solid var(--neon-orange)}
.badge.tidak,.badge.belum{background:rgba(255,0,85,0.1);color:var(--neon-red);border:1px solid var(--neon-red)}
.badge.terlaksana{background:rgba(0,255,136,0.1);color:var(--neon-green);border:1px solid var(--neon-green)}

.form-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.form-row input,.form-row select{flex:1;min-width:120px;padding:10px 12px;background:#0a0a0c;border:1px solid #333;border-radius:8px;font-size:14px;color:#fff;outline:none}
.form-row input:focus,.form-row select:focus{border-color:var(--neon-cyan)}
.btn-sm{padding:10px 16px;font-size:13px;background:transparent;color:var(--neon-cyan);border:1px solid var(--neon-cyan);border-radius:8px;cursor:pointer;font-weight:700;transition:.3s}
.btn-sm:hover{background:var(--neon-cyan);color:#000;box-shadow:0 0 10px var(--neon-cyan)}

.proker-item{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid #222;border-radius:10px;margin-bottom:8px;gap:8px;flex-wrap:wrap;background:#0a0a0c}
.proker-name{font-weight:600;font-size:14px;flex:1;color:#fff}
.proker-actions{display:flex;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;background:transparent;transition:.3s}
.icon-btn.edit{color:var(--neon-orange);border:1px solid var(--neon-orange)}
.icon-btn.edit:hover{background:var(--neon-orange);color:#000}
.icon-btn.del{color:var(--neon-red);border:1px solid var(--neon-red)}
.icon-btn.del:hover{background:var(--neon-red);color:#fff}

.empty{text-align:center;color:#666;font-size:13px;padding:20px 0}
.month-picker{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.month-picker input{padding:8px 12px;border:1px solid #333;border-radius:8px;font-size:14px;background:#0a0a0c;color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card-bg);border:1px solid var(--neon-green);color:var(--neon-green);padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;box-shadow:0 0 20px rgba(0,255,136,0.3);z-index:1000;opacity:0;transition:.3s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-10px)}
.toast.error{border-color:var(--neon-red);color:var(--neon-red);box-shadow:0 0 20px rgba(255,0,85,0.3)}
@media(max-width:600px){.login-card{padding:30px 22px}.header-title{font-size:12px}.user-badge{display:none}main.content{padding:12px}.card{padding:14px}nav.tabs{top:66px}}
</style>
</head>
<body>

<div id="loginView">
  <div class="login-card">
    <div class="logo-wrap">
      <svg viewBox="0 0 100 100" width="80" height="80">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#00ff88" stroke-width="3"/>
        <path d="M30 78 L30 55 Q50 28 70 55 L70 78 Z" fill="#00ff88"/>
        <path d="M45 78 L45 62 Q50 56 55 62 L55 78 Z" fill="#0a0a0c"/>
        <circle cx="50" cy="24" r="3.5" fill="#00f3ff"/>
      </svg>
    </div>
    <h1>PORTAL PRESENSI</h1>
    <h2>TPA PAMAN</h2>
    <p class="welcome">Silakan masuk untuk melanjutkan</p>
    <form id="loginForm">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">Login System</button>
      <div class="error-msg" id="loginError"></div>
    </form>
    <!-- TEKS HINT SUDAH DIHAPUS DARI SINI -->
  </div>
</div>

<div id="appView" class="hidden">
  <header class="app-header">
    <div class="header-left">
      <svg class="header-logo" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="48" fill="none" stroke="#00f3ff" stroke-width="3"/>
        <path d="M30 78 L30 55 Q50 28 70 55 L70 78 Z" fill="#00ff88"/>
        <path d="M45 78 L45 62 Q50 56 55 62 L55 78 Z" fill="#000"/>
      </svg>
      <div>
        <div class="header-title">PORTAL TPA PAMAN</div>
        <div class="header-sub"><span id="userRole"></span> · <span id="userName"></span></div>
      </div>
    </div>
    <div class="header-right">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn-logout" onclick="doLogout()">Keluar</button>
    </div>
  </header>
  <nav class="tabs">
    <button data-tab="dashboard" class="active">Dasbor</button>
    <button data-tab="rekap">Rekap Bulanan</button>
    <button data-tab="guru">Data Guru</button>
    <button data-tab="proker">Proker</button>
  </nav>
  <main class="content">
    <section id="dashboardView">
      <div class="stats-grid">
        <div class="stat-box"><div class="num" id="statTotalGuru">0</div><div class="label">Total Guru</div></div>
        <div class="stat-box tepat"><div class="num" id="statTepat">0</div><div class="label">Tepat Waktu</div></div>
        <div class="stat-box telat"><div class="num" id="statTelat">0</div><div class="label">Telat</div></div>
        <div class="stat-box tidak"><div class="num" id="statTidak">0</div><div class="label">Tidak Hadir</div></div>
      </div>
      <div class="card">
        <h2>📋 Presensi Hari Ini</h2>
        <div class="date-info" id="todayDate"></div>
        <div id="todayAttendance"></div>
      </div>
    </section>
    <section id="rekapView" class="hidden">
      <div class="card">
        <h2>📊 Rekap Bulanan</h2>
        <div class="month-picker"><input type="month" id="rekapMonth"></div>
        <table>
          <thead><tr><th>Nama Guru</th><th>Kelas</th><th>Tepat</th><th>Telat</th><th>Tidak</th><th>Total</th></tr></thead>
          <tbody id="rekapBody"></tbody>
        </table>
      </div>
    </section>
    <section id="guruView" class="hidden">
      <div class="card hidden" id="guruAdminForm">
        <h2>➕ Tambah Guru <span style="font-size:11px;color:#888">(Admin)</span></h2>
        <div class="form-row">
          <input type="text" id="newGuruName" placeholder="Nama guru">
          <select id="newGuruClass"><option value="A">Kelas A</option><option value="B">Kelas B</option><option value="C">Kelas C</option></select>
          <button class="btn-sm" onclick="addTeacher()">Tambah</button>
        </div>
      </div>
      <div class="card">
        <h2>👥 Daftar Guru</h2>
        <div id="guruList"></div>
      </div>
    </section>
    <section id="prokerView" class="hidden">
      <div class="card hidden" id="prokerAdminForm">
        <h2>➕ Tambah Proker <span style="font-size:11px;color:#888">(Admin)</span></h2>
        <div class="form-row">
          <input type="text" id="newProkerName" placeholder="Nama program kerja">
          <select id="newProkerStatus"><option value="terlaksana">Terlaksana</option><option value="tidak">Belum Terlaksana</option></select>
          <button class="btn-sm" onclick="addProker()">Tambah</button>
        </div>
      </div>
      <div class="card">
        <h2>📌 Program Kerja</h2>
        <div id="prokerList"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = {
  token: localStorage.getItem('token') || '',
  user: null,
  async call(method, path, body) {
    const res = await fetch('/api' + path, {
      method,
      headers: { 'Content-Type': 'application/json', 'Authorization': this.token },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { this.logout(); throw new Error('Sesi berakhir'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan');
    return data;
  },
  logout() { localStorage.removeItem('token'); this.token = ''; this.user = null; showLogin(); }
};
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' error' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = 'toast', 2500);
}
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function showLogin() { document.getElementById('loginView').classList.remove('hidden'); document.getElementById('appView').classList.add('hidden'); }
function showApp() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('userName').textContent = API.user.name;
  document.getElementById('userRole').textContent = API.user.role === 'admin' ? 'Admin' : 'Member';
  document.getElementById('userBadge').textContent = API.user.name;
  switchTab('dashboard');
}
function doLogout() { API.call('POST', '/logout').catch(()=>{}); API.logout(); }

document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('username').value.trim(), password: document.getElementById('password').value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Gagal login');
    API.token = data.token; API.user = data.user;
    localStorage.setItem('token', data.token);
    showApp();
  } catch (e) { err.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = 'Login System'; }
});

function switchTab(name) {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  ['dashboard','rekap','guru','proker'].forEach(t => document.getElementById(t + 'View').classList.toggle('hidden', t !== name));
  if (name === 'dashboard') renderDashboard();
  if (name === 'rekap')     renderRekap();
  if (name === 'guru')      renderGuru();
  if (name === 'proker')    renderProker();
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => switchTab(b.dataset.tab)));

async function renderDashboard() {
  try {
    const [teachers, attendance] = await Promise.all([API.call('GET', '/teachers'), API.call('GET', '/attendance')]);
    const today = todayStr();
    const todayAtt = {};
    attendance.filter(a => a.date === today).forEach(a => todayAtt[a.teacherId] = a.status);
    document.getElementById('statTotalGuru').textContent = teachers.length;
    document.getElementById('statTepat').textContent = Object.values(todayAtt).filter(s => s === 'tepat').length;
    document.getElementById('statTelat').textContent = Object.values(todayAtt).filter(s => s === 'telat').length;
    document.getElementById('statTidak').textContent = Object.values(todayAtt).filter(s => s === 'tidak').length;
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const container = document.getElementById('todayAttendance');
    let html = '';
    ['A','B','C'].forEach(c => {
      const list = teachers.filter(t => t.class === c);
      if (!list.length) return;
      html += `<div class="class-section"><div class="class-header">Kelas ${c}</div>`;
      list.forEach(t => {
        const cur = todayAtt[t.id] || '';
        html += `<div class="teacher-row">
          <div class="teacher-info"><span class="teacher-name">${esc(t.name)}</span><span class="teacher-class">Kelas ${c}</span></div>
          <div class="att-buttons">
            <button class="att-btn tepat ${cur==='tepat'?'active':''}" onclick="markAttendance('${t.id}','tepat')">Tepat Waktu</button>
            <button class="att-btn telat ${cur==='telat'?'active':''}" onclick="markAttendance('${t.id}','telat')">Telat</button>
            <button class="att-btn tidak ${cur==='tidak'?'active':''}" onclick="markAttendance('${t.id}','tidak')">Tidak Hadir</button>
          </div></div>`;
      });
      html += `</div>`;
    });
    container.innerHTML = html || '<div class="empty">Belum ada guru terdaftar.</div>';
  } catch (e) { toast(e.message, true); }
}
async function markAttendance(teacherId, status) {
  try { await API.call('POST', '/attendance', { teacherId, date: todayStr(), status }); toast('Presensi tersimpan ✓'); renderDashboard(); }
  catch (e) { toast(e.message, true); }
}

async function renderRekap() {
  const input = document.getElementById('rekapMonth');
  if (!input.value) { const d = new Date(); input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
  try {
    const data = await API.call('GET', '/rekap?month=' + input.value);
    const tbody = document.getElementById('rekapBody');
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada data.</td></tr>'; return; }
    tbody.innerHTML = data.map(r => `<tr>
      <td>${esc(r.name)}</td><td>Kelas ${r.class}</td>
      <td><span class="badge tepat">${r.tepatWaktu}</span></td>
      <td><span class="badge telat">${r.telat}</span></td>
      <td><span class="badge tidak">${r.tidakHadir}</span></td>
      <td><strong>${r.total}</strong></td></tr>`).join('');
  } catch (e) { toast(e.message, true); }
}
document.getElementById('rekapMonth').addEventListener('change', renderRekap);

async function renderGuru() {
  try {
    const teachers = await API.call('GET', '/teachers');
    const isAdmin = API.user.role === 'admin';
    document.getElementById('guruAdminForm').classList.toggle('hidden', !isAdmin);
    const list = document.getElementById('guruList');
    if (!teachers.length) { list.innerHTML = '<div class="empty">Belum ada guru.</div>'; return; }
    let html = '';
    ['A','B','C'].forEach(c => {
      const items = teachers.filter(t => t.class === c);
      if (!items.length) return;
      html += `<div class="class-section"><div class="class-header">Kelas ${c}</div>`;
      items.forEach(t => {
        html += `<div class="teacher-row">
          <div class="teacher-info"><span class="teacher-name">${esc(t.name)}</span><span class="teacher-class">Kelas ${t.class}</span></div>
          ${isAdmin ? `<button class="icon-btn del" onclick="deleteTeacher('${t.id}','${esc(t.name)}')">🗑️</button>` : ''}
        </div>`;
      });
      html += `</div>`;
    });
    list.innerHTML = html;
  } catch (e) { toast(e.message, true); }
}
async function addTeacher() {
  const name = document.getElementById('newGuruName').value.trim();
  const cls = document.getElementById('newGuruClass').value;
  if (!name) return toast('Nama guru wajib diisi', true);
  try { await API.call('POST', '/teachers', { name, class: cls }); document.getElementById('newGuruName').value = ''; toast('Guru ditambahkan ✓'); renderGuru(); }
  catch (e) { toast(e.message, true); }
}
async function deleteTeacher(id, name) {
  if (!confirm(`Hapus guru "${name}"?`)) return;
  try { await API.call('DELETE', '/teachers/' + id); toast('Guru dihapus'); renderGuru(); }
  catch (e) { toast(e.message, true); }
}

async function renderProker() {
  try {
    const proker = await API.call('GET', '/proker');
    const isAdmin = API.user.role === 'admin';
    document.getElementById('prokerAdminForm').classList.toggle('hidden', !isAdmin);
    const list = document.getElementById('prokerList');
    if (!proker.length) { list.innerHTML = '<div class="empty">Belum ada program kerja.</div>'; return; }
    list.innerHTML = proker.map(p => `<div class="proker-item">
      <span class="proker-name">${esc(p.name)}</span>
      <span class="badge ${p.status === 'terlaksana' ? 'terlaksana' : 'belum'}">${p.status === 'terlaksana' ? '✓ Terlaksana' : '✗ Belum Terlaksana'}</span>
      ${isAdmin ? `<div class="proker-actions">
        <button class="icon-btn edit" title="Ubah status" onclick="toggleProker('${p.id}','${p.status}')">🔄</button>
        <button class="icon-btn del" title="Hapus" onclick="deleteProker('${p.id}','${esc(p.name)}')">🗑️</button>
      </div>` : ''}</div>`).join('');
  } catch (e) { toast(e.message, true); }
}
async function addProker() {
  const name = document.getElementById('newProkerName').value.trim();
  const status = document.getElementById('newProkerStatus').value;
  if (!name) return toast('Nama proker wajib diisi', true);
  try { await API.call('POST', '/proker', { name, status }); document.getElementById('newProkerName').value = ''; toast('Proker ditambahkan ✓'); renderProker(); }
  catch (e) { toast(e.message, true); }
}
async function toggleProker(id, cur) {
  const next = cur === 'terlaksana' ? 'tidak' : 'terlaksana';
  try { await API.call('PUT', '/proker/' + id, { status: next }); toast('Status diubah ✓'); renderProker(); }
  catch (e) { toast(e.message, true); }
}
async function deleteProker(id, name) {
  if (!confirm(`Hapus proker "${name}"?`)) return;
  try { await API.call('DELETE', '/proker/' + id); toast('Proker dihapus'); renderProker(); }
  catch (e) { toast(e.message, true); }
}

(async () => {
  if (API.token) {
    try { API.user = await API.call('GET', '/me'); showApp(); return; } catch (e) {}
  }
  showLogin();
})();
</script>
